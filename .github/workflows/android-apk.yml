name: Build Android APK (no EAS)

# Builds a debug APK entirely inside GitHub Actions using Expo's prebuild + Gradle
# directly — bypasses EAS Build entirely, so it needs no Expo account, no EAS project
# link, and no token. Trade-off: this is a debug build (auto-signed with Gradle's
# throwaway debug keystore), fine for installing on a phone to test, not for the
# Play Store — that path still goes through EAS (see eas-init.yml) or a release
# signing setup added later.
on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo prebuild (generate native android/ project)
        working-directory: apps/mobile
        env:
          CI: "1"
        run: npx expo prebuild --platform android

      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gate-force-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
