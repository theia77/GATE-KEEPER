name: Build Android APK (no EAS)

# Builds a release APK entirely inside GitHub Actions using Expo's prebuild + Gradle
# directly — bypasses EAS Build entirely, so it needs no Expo account, no EAS project
# link, and no token. A *release* build (not debug) is required here: debug builds
# don't embed the JS bundle, they fetch it live from a Metro dev server, which doesn't
# exist off this runner — installing one standalone just shows a red "Unable to load
# script" screen. Release builds bundle the JS in at build time, so they run standalone.
# Still auto-signed with Gradle's throwaway debug keystore (RN template default), so
# it's fine for installing on a phone to test, not for the Play Store — that path still
# goes through EAS (see eas-init.yml) or a real release signing setup added later.
on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      # Public/publishable values only — safe to bake into a client build, same ones
      # the deployed web app uses. Never put the Supabase service_role key here.
      EXPO_PUBLIC_SUPABASE_URL: "https://zfbldpqmzcsrvkjhuqsh.supabase.co"
      EXPO_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmYmxkcHFtemNzcnZramh1cXNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2MjU2OTksImV4cCI6MjEwMDIwMTY5OX0.WJVSsMOlLmZilF0vDEKWTa7WgIOQggJmkztg4eL9mTQ"
      EXPO_PUBLIC_API_URL: "https://gate-keeper-web-rgyz.vercel.app"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo prebuild (generate native android/ project)
        working-directory: apps/mobile
        env:
          CI: "1"
        run: npx expo prebuild --platform android

      - name: Assemble release APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gate-force-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
